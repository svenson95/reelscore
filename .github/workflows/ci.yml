name: Continuous Integration

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    name: Run API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MONGODB_USER: ${{ secrets.MONGODB_USER }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      MONGODB_CLUSTER: ${{ secrets.MONGODB_CLUSTER }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npx nx lint api

      - name: Run Unit, Component and Integration Tests
        run: npx nx test api --skip-nx-cache --outputStyle=stream-without-prefixes

      - name: Run E2E Tests
        run: npx nx e2e api-e2e --skip-nx-cache --outputStyle=stream-without-prefixes

  test-client:
    name: Run Client Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      API_PORT: 3333
      MONGODB_USER: ${{ secrets.MONGODB_USER }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      MONGODB_CLUSTER: ${{ secrets.MONGODB_CLUSTER }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npx nx lint client

      - name: Run Unit, Component and Integration Tests
        run: npx nx test client --skip-nx-cache --outputStyle=stream-without-prefixes

      - name: Build Application
        run: npx nx build client --configuration=production

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E Tests
        run: npx nx e2e client-e2e --project=chromium --skip-nx-cache --outputStyle=stream-without-prefixes

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: client-playwright-report
          path: dist/.playwright/apps/client-e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

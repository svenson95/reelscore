name: Continuous Integration

on:
  workflow_dispatch:

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run Tests
    uses: ./.github/workflows/tests.yml
    with:
      skip_tests: ${{ github.ref_name == 'bot/update-architecture-diagram' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'skip-tests')) }}
    secrets:
      MONGODB_USER: ${{ secrets.MONGODB_USER }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      MONGODB_CLUSTER: ${{ secrets.MONGODB_CLUSTER }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}

  sonarcloud:
    name: Analyze Code
    if: ${{ always() && needs.tests.result != 'failure' && needs.tests.result != 'cancelled' && github.ref_name != 'bot/update-architecture-diagram' }}
    needs: tests
    uses: ./.github/workflows/sonarcloud.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

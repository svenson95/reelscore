name: Reelscore CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

concurrency:
  group: reelscore-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-checks:
    name: API checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PORT: ${{ secrets.PORT }}
      MONGODB_USER: ${{ secrets.MONGODB_USER }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      MONGODB_CLUSTER: ${{ secrets.MONGODB_CLUSTER }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        run: npx nx lint api

      - name: Run API unit tests
        run: npx nx test api --skip-nx-cache

      - name: Build API
        run: npx nx build api --configuration=production

      - name: Run API E2E tests
        run: npx nx e2e api-e2e --skip-nx-cache

  client-checks:
    name: Client checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PORT: ${{ secrets.PORT }}
      MONGODB_USER: ${{ secrets.MONGODB_USER }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      MONGODB_CLUSTER: ${{ secrets.MONGODB_CLUSTER }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint client
        run: npx nx lint client

      - name: Run client unit tests
        run: npx nx test client --skip-nx-cache

      - name: Build client
        run: npx nx build client --configuration=production

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run client E2E tests
        run: npx nx e2e client-e2e --project=chromium --skip-nx-cache

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: client-playwright-report
          path: dist/.playwright/apps/client-e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

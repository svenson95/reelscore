name: SonarCloud Analysis

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  analyze:
    name: Analyze Code with SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Download API Coverage
        uses: actions/download-artifact@v4
        with:
          name: api-coverage
          path: coverage/apps/api

      - name: Download Client Coverage
        uses: actions/download-artifact@v4
        with:
          name: client-coverage
          path: coverage/apps/client

      - name: Download Shared Library Coverage
        uses: actions/download-artifact@v4
        with:
          name: shared-library-coverage
          path: coverage/lib

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

name: Update Architecture Diagram

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-architecture-diagram:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Nx project graph JSON
        run: npx nx graph --print > /tmp/nx-project-graph.json

      - name: Update README architecture diagram
        run: >-
          node scripts/generate-architecture-diagram.cjs
          /tmp/nx-project-graph.json README.md

      - name: Commit changed README
        run: |
          if git diff --quiet -- README.md; then
            echo "README architecture diagram is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update generated architecture diagram"
          git push

name: Update Architecture Diagram

on:
  workflow_call:

permissions:
  contents: read

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.README_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.README_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Nx project graph JSON
        run: npx nx graph --print > /tmp/nx-project-graph.json

      - name: Update README architecture diagram
        run: >-
          node scripts/generate-architecture-diagram.cjs
          /tmp/nx-project-graph.json README.md

      - name: Create or update README pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README architecture diagram is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update generated architecture diagram"

          branch="bot/update-architecture-diagram"
          git push --force origin "HEAD:refs/heads/$branch"

          pull_request_number=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pull_request_number" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "docs: update generated architecture diagram" \
              --body "Updates the generated Nx architecture diagram after a successful production deployment." \
              --label "skip-tests"
          else
            gh pr edit "$pull_request_number" \
              --title "docs: update generated architecture diagram" \
              --body "Updates the generated Nx architecture diagram after a successful production deployment." \
              --add-label "skip-tests"
          fi
